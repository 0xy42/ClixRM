name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-dev.*'  # Dev builds from develop branch

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x 

      - name: Extract Version from Tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        shell: bash

      - name: Determine Release Type and Verify Branch
        id: release_type
        run: |
          BRANCH=$(git branch -r --contains ${{ github.ref }} | grep -E 'origin/(main|develop)' | sed 's/.*origin\///' | head -n1)
          
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Stable release
            if [ "$BRANCH" != "main" ]; then
              echo "❌ Error: Stable releases (v*.*.*) must be tagged from main branch"
              echo "Current branch: $BRANCH"
              exit 1
            fi
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "RELEASE_CHANNEL=stable" >> $GITHUB_ENV
            echo "CHANNEL_LABEL=" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" =~ -dev\. ]]; then
            
            # Dev release 
            if [ "$BRANCH" != "develop" ]; then
              echo "❌ Error: Dev releases (v*.*.*-dev.*) must be tagged from develop branch"
              echo "Current branch: $BRANCH"
              exit 1
            fi
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "RELEASE_CHANNEL=dev" >> $GITHUB_ENV
            echo "CHANNEL_LABEL=_dev" >> $GITHUB_ENV
          else
            echo "❌ Error: Invalid tag format. Use v*.*.* for stable or v*.*.*-dev.* for dev releases"
            exit 1
          fi
          
          echo "✅ Valid $RELEASE_CHANNEL release from $BRANCH branch"
        shell: bash

      - name: Restore Dependencies
        run: dotnet restore ./ClixRM/ClixRM.csproj

      - name: Publish Framework-Dependent Windows Build
        run: dotnet publish ./ClixRM/ClixRM.csproj --configuration Release --runtime win-x64 --self-contained false -p:Version=${{ env.VERSION }} -p:InformationalVersion=${{ env.VERSION }} --output ./publish_framework_dependent

      - name: Create Framework-Dependent Build Artifact
        run: |
          mkdir -p ./artifacts_framework_dependent
          Compress-Archive -Path ./publish_framework_dependent/* -DestinationPath ./artifacts_framework_dependent/ClixRM_Windows${{ env.CHANNEL_LABEL }}_${{ env.VERSION }}.zip

      - name: Publish Bundled Windows Build (Single File)
        run: dotnet publish ./ClixRM/ClixRM.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:Version=${{ env.VERSION }} -p:InformationalVersion=${{ env.VERSION }} --output ./publish_bundled

      - name: Create Bundled Build Artifact
        run: |
          mkdir -p ./artifacts_bundled
          Compress-Archive -Path ./publish_bundled/* -DestinationPath ./artifacts_bundled/ClixRM_Windows_Bundled${{ env.CHANNEL_LABEL }}_${{ env.VERSION }}.zip

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ./artifacts_framework_dependent/ClixRM_Windows${{ env.CHANNEL_LABEL }}_${{ env.VERSION }}.zip
            ./artifacts_bundled/ClixRM_Windows_Bundled${{ env.CHANNEL_LABEL }}_${{ env.VERSION }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: ${{ env.RELEASE_CHANNEL == 'stable' && format('Release {0}', github.ref_name) || format('Dev Build {0}', github.ref_name) }}
          body: |
            ${{ env.RELEASE_CHANNEL == 'stable' && '🟢 **Stable Release**' || '🔧 **Development Build**' }}
            
            ${{ env.RELEASE_CHANNEL == 'stable' && 'Production-ready release from main branch.' || 'Development build from develop branch. For testing and preview purposes only.' }}

            **Artifacts:**
            - `ClixRM_Windows${{ env.CHANNEL_LABEL }}_${{ env.VERSION }}.zip`: Framework-dependent Windows build (requires .NET 8.0 x64 runtime).
            - `ClixRM_Windows_Bundled${{ env.CHANNEL_LABEL }}_${{ env.VERSION }}.zip`: Self-contained, single-file executable for Windows (no .NET runtime needed).
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          makeLatest: ${{ env.RELEASE_CHANNEL == 'stable' }}
